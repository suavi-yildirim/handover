<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14171c">
<title>Handover controller</title>
<style>
  :root {
    --bg: #14171c; --panel: #1f242c; --line: #333a45; --text: #e8ecf1; --muted: #8b95a3;
    --accent: #4fb3ff; --ok: #3ecf8e; --warn: #f5b942; --bad: #ff6b6b; --grip: #ff9f43;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  body {
    display: grid; grid-template-rows: auto 1fr;
    padding: max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
             max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    gap: 8px;
  }
  header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin-right: auto; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); }
  .dot.wait { background: var(--warn); }
  .dot.ok { background: var(--ok); }
  button {
    font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 12px; min-height: 40px;
  }
  button.on { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: 0.4; }
  .readout { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); min-width: 9em; }

  main {
    display: grid; gap: 12px; min-height: 0;
    grid-template-columns: 1fr auto; grid-template-rows: 1fr auto;
    grid-template-areas: "move lift" "move grip";
  }
  @media (orientation: portrait) {
    main { grid-template-columns: 1fr auto; grid-template-rows: auto 1fr; grid-template-areas: "grip grip" "move lift"; }
  }
  .pad { position: relative; display: grid; place-items: center; touch-action: none; }
  .pad .label { position: absolute; font-size: 12px; color: var(--muted); pointer-events: none; }
  .stick {
    position: relative; border-radius: 50%; background: var(--panel); border: 2px solid var(--line);
    width: min(100%, 100vmin - 140px, 320px); aspect-ratio: 1; display: grid; place-items: center; touch-action: none;
  }
  .slider {
    position: relative; border-radius: 40px; background: var(--panel); border: 2px solid var(--line);
    width: 76px; height: min(100%, 280px); display: grid; place-items: center; touch-action: none;
  }
  .stick.active, .slider.active { border-color: var(--accent); }
  .knob {
    width: 64px; height: 64px; border-radius: 50%; background: #3a4350; border: 2px solid #56606e;
    pointer-events: none; will-change: transform;
  }
  .active .knob { background: var(--accent); border-color: var(--accent); }
  .tick { position: absolute; font-size: 11px; color: var(--muted); pointer-events: none; }
  #move { grid-area: move; justify-items: start; padding-left: 4vw; }
  @media (orientation: portrait) { #move { justify-items: center; padding-left: 0; } }
  #grip { min-width: 120px; }
  #lift { grid-area: lift; }
  #grip {
    grid-area: grip; min-height: 76px; font-size: 20px; font-weight: 600; border-radius: 16px;
    border-width: 2px; letter-spacing: 0.02em;
  }
  #grip.closed { background: var(--grip); border-color: var(--grip); color: #1b1206; }
  .clutch {
    width: min(100%, 420px); height: min(100%, 300px); border-radius: 24px; background: var(--panel);
    border: 2px dashed var(--line); display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 8px; text-align: center; padding: 16px; touch-action: none;
  }
  .clutch b { font-size: 22px; }
  .clutch span { font-size: 13px; color: var(--muted); max-width: 24em; }
  .clutch.active { background: #17344a; border: 2px solid var(--accent); }
  [hidden] { display: none !important; }
  #msg {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); max-width: 90vw;
    background: #2a2f37; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
    font-size: 13px; display: none;
  }
</style>
</head>
<body>
  <header>
    <div class="status"><span class="dot" id="dot"></span><span id="status">Connecting…</span></div>
    <span class="readout" id="readout"></span>
    <button id="mode">Motion</button>
    <button id="kind" hidden>Aim</button>
    <button id="tilt">Tilt: off</button>
    <button id="recenter" disabled>Recenter</button>
  </header>
  <main>
    <div class="pad" id="move">
      <div class="clutch" id="clutch" hidden><b>Hold to move</b>
        <span id="clutchHelp">turn the phone to slide, tip it to reach, twist to roll</span></div>
      <div class="stick" id="moveStick"><div class="knob"></div>
        <span class="tick" style="top:6px">fwd</span>
        <span class="tick" style="bottom:6px">back</span>
        <span class="tick" style="left:8px">left</span>
        <span class="tick" style="right:8px">right</span>
      </div>
    </div>
    <div class="pad" id="lift">
      <div class="slider" id="liftStick"><div class="knob"></div>
        <span class="tick" style="top:8px">up</span>
        <span class="tick" style="bottom:8px">down</span>
      </div>
    </div>
    <button id="grip">Grip</button>
  </main>
  <div id="msg"></div>
  <script type="module" src="./controller.js"></script>
</body>
</html>
